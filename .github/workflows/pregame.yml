# Phase 4 pregame planner. Targets one odds snapshot about 20 minutes before each kickoff slot
# (window T-30 to T-10; one late attempt allowed down to T-5; never after kickoff; at most 2 pulls
# per slot). The result is labeled last_observed_pregame when it is a game's last snapshot, and
# close_quality only if taken 0-30 min before kickoff with >= 5 books. It is never called a closing line.
#
# Cost control:
#   - The `gate` job runs every 10 minutes in the UTC windows below. It uses only the FREE /events
#     endpoint, the records file list, and the paired-quote files (a game is covered only if a snapshot in
#     its T-30..T-10 window actually quoted THAT game, by event id). No package install, never spends a credit.
#   - The `pull` job runs only when the gate finds an uncovered kickoff slot in the window. Right before
#     paying it re-checks the plan against the latest records (a queued job never pays after kickoff or
#     for a slot another pull already covered), then spends 1 credit (frozen 10-book list) after a free
#     balance preflight (reserve 60, weekly cap 30, fail closed, any HALT file stops everything).
# Windows cover NFL kickoffs in both EDT and EST, plus dated windows for the 2026 off-day games
# (Wed Nov 25, Thanksgiving Nov 26, Fri Nov 27, Saturdays in Dec/Jan, Christmas Fri Dec 25).
# GitHub may delay scheduled runs; the planner labels what actually happened.
#
# TRIGGERS (hybrid, scheduling recovery Oct 2026): the PRIMARY trigger is an external scheduler
# (cron-job.org, America/New_York) calling workflow_dispatch with {source: external} every 5 minutes
# inside kickoff windows. The */10 GitHub crons below are the BACKUP. Whatever starts it, the gate is
# free and decides game by game, so an extra or late trigger can never buy a pull outside a valid
# window or a second pull for a game already quoted in its window. Pull jobs are serialized
# (concurrency pregame-records) and re-check the plan against fresh records right before paying.
# When a scheduled full-slate snapshot is due inside a game's window (9:30 AM ET international games
# vs sun_scheduled 9:10), the planner waits up to 8 minutes for it instead of buying a second pull.
name: Pregame planner

on:
  schedule:
    - cron: "*/10 13-23 * * 0"     # Sunday 9:30 AM, 1:00, 4:05, 4:25 PM ET (EDT and EST)
    - cron: "*/10 0-2 * * 1"       # Sunday night (SNF) -> Monday UTC
    - cron: "*/10 22-23 * * 1"     # Monday early evening ET (EDT doubleheaders)
    - cron: "*/10 0-2 * * 2"       # Monday night (MNF) -> Tuesday UTC
    - cron: "*/10 23 * * 4"        # Thursday night, EDT lead-in
    - cron: "*/10 0-2 * * 5"       # Thursday night (TNF) -> Friday UTC
    - cron: "*/10 0-1 26 11 *"     # Wed Nov 25 2026, 8:00 PM ET
    - cron: "*/10 17-23 26 11 *"   # Thanksgiving Nov 26 2026 daytime
    - cron: "*/10 19-20 27 11 *"   # Fri Nov 27 2026, 3:00 PM ET
    - cron: "*/10 17-23 * 12,1 6"  # Saturdays in Dec/Jan
    - cron: "*/10 0-2 * 12,1 0"    # Saturday night games -> Sunday UTC (Dec/Jan)
    - cron: "*/10 17-23 25 12 *"   # Christmas Fri Dec 25 2026
    - cron: "*/10 0-1 26 12 *"     # Christmas night -> Dec 26 UTC
  workflow_dispatch:
    inputs:
      source:
        description: "who started this run (the external scheduler sends: external)"
        default: "manual"
        type: choice
        options: [manual, external]

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      pull: ${{ steps.plan.outputs.pull }}
      targets: ${{ steps.plan.outputs.targets }}
    steps:
      - name: Check out source (main, read-only use)
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            src/nfl/market
      - name: Records file list and paired-quote files (no raw snapshot bodies downloaded)
        run: |
          # A failed listing must NOT look like "no snapshots yet": fail the gate instead (no pull).
          git clone --quiet --depth 1 --filter=blob:none --no-checkout --branch records \
            "https://github.com/${{ github.repository }}.git" rec
          git -C rec ls-tree -r --name-only HEAD data/odds/raw | sed 's#.*/##' > raw_names.txt
          test -s raw_names.txt
          # per-game coverage comes from the small paired-quote files, not from snapshot filenames
          git -C rec sparse-checkout set data/odds/quotes
          git -C rec checkout --quiet records
          wc -l raw_names.txt; ls rec/data/odds/quotes 2>/dev/null | wc -l
      - name: Plan (free /events only)
        id: plan
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          PYTHONPATH: .
        run: python3 -m src.nfl.market.pregame_gate --raw-list raw_names.txt --odds-dir rec/data/odds --github-output "$GITHUB_OUTPUT"

  pull:
    needs: gate
    if: needs.gate.outputs.pull == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: pregame-records      # separate from weekly: a pregame pull can never displace a pending weekly run
      cancel-in-progress: false
    steps:
      - name: Check out source (main, read-only use)
        uses: actions/checkout@v4
        with:
          ref: main
          path: code
          persist-credentials: false
      - name: Check out records branch
        run: |
          git clone --quiet "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" records
          git -C records checkout records
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: code
        run: pip install -e .
      - name: Restore prior records
        run: |
          mkdir -p code/data/odds code/data/predictions code/data/weather
          cp -a records/data/odds/. code/data/odds/ 2>/dev/null || true
          cp -a records/data/predictions/. code/data/predictions/ 2>/dev/null || true
          cp -a records/data/weather/. code/data/weather/ 2>/dev/null || true
      - name: Schedules only (for game_id matching and venues)
        working-directory: code
        run: python run.py data --schedules-only
      # Safeguard 3: claim the target games on `records` (push WITHOUT rebase) right before paying. Games
      # claimed by another in-progress pull, or inside the window of an in-progress scheduled snapshot, are
      # dropped; no claim recorded = no payment (fail closed).
      - name: Claim the paid pull (compare-and-swap on records)
        id: claim
        working-directory: code
        env:
          TRIGGER: ${{ github.event_name == 'schedule' && 'github_cron' || (github.event.inputs.source == 'external' && 'external_dispatch' || 'manual') }}
          TARGETS: ${{ needs.gate.outputs.targets }}
        run: >-
          python run.py claim --repo ../records --odds-dir data/odds --mode pregame --targets "$TARGETS"
          --trigger "$TRIGGER" --run-id "${{ github.run_id }}-${{ github.run_attempt }}" --github-output "$GITHUB_OUTPUT"
      - name: Pregame odds snapshot + forecast weather (1 credit; re-checks the plan first, skips at 0 credits)
        id: odds
        if: steps.claim.outputs.pay == 'true'
        working-directory: code
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TRIGGER: ${{ github.event_name == 'schedule' && 'github_cron' || (github.event.inputs.source == 'external' && 'external_dispatch' || 'manual') }}
          TARGETS: ${{ steps.claim.outputs.targets }}
        run: python run.py odds --kind pregame_window --trigger "$TRIGGER" --targets "$TARGETS" --github-output "$GITHUB_OUTPUT"
      - name: Copy records
        if: always()
        run: |
          cp -a code/data/odds/. records/data/odds/
          mkdir -p records/data/weather
          cp -a code/data/weather/. records/data/weather/ 2>/dev/null || true
      - name: Guard
        id: guard
        if: always()
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          # never-published temp files from an interrupted crash-safe write are not records
          find records/data -name '.tmp-*' -type f -print -delete
          git -C records add -A
          python code/src/nfl/ops/records_guard.py --repo records
          git -C records diff --cached --stat
      - name: Commit and push to records
        if: always() && steps.guard.outcome == 'success'
        working-directory: records
        run: |
          git -c user.name="pregame-bot" -c user.email="pregame-bot@users.noreply.github.com" \
            commit -q -m "records: pregame_window snapshot $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3; do
            if git push origin HEAD:refs/heads/records; then exit 0; fi
            # every snapshot writes NEW files only, so a concurrent records commit rebases cleanly
            git -c user.name="pregame-bot" -c user.email="pregame-bot@users.noreply.github.com" pull --rebase --quiet origin records
          done
          echo "::error title=records::push failed after 3 attempts"; exit 1
      # Safeguard 2: a paid capture counts only once its raw file is read back from the REMOTE records branch.
      - name: Verify capture on remote records
        id: verify
        if: always() && steps.odds.outputs.raw_file != ''
        env:
          RAW_FILE: ${{ steps.odds.outputs.raw_file }}
        run: |
          if git -C records fetch --quiet origin records && git -C records cat-file -e "FETCH_HEAD:data/odds/raw/$RAW_FILE"; then
            echo "verified=true" >> "$GITHUB_OUTPUT"
          else
            echo "verified=false" >> "$GITHUB_OUTPUT"
            echo "::error title=records::paid capture $RAW_FILE is NOT on the remote records branch"; exit 1
          fi
      - name: Keep an unverified paid capture as a run artifact (recovery copy)
        if: always() && steps.odds.outputs.raw_file != '' && steps.verify.outputs.verified != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unverified-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            code/data/odds/raw/${{ steps.odds.outputs.raw_file }}
            code/data/odds/quotes/
          retention-days: 30
      - name: Heartbeat
        if: always()
        working-directory: code
        env:
          HC_PING_KEY: ${{ secrets.HC_PING_KEY }}
          PYTHONPATH: .
          CLAIM_STATE: ${{ steps.claim.outputs.state }}
          CLAIM_OUTCOME: ${{ steps.claim.outcome }}
          ODDS_OUTCOME: ${{ steps.odds.outcome }}
          SKIP_REASON: ${{ steps.odds.outputs.skip_reason }}
          RAW_FILE: ${{ steps.odds.outputs.raw_file }}
          VERIFIED: ${{ steps.verify.outputs.verified }}
          JOB_STATUS: ${{ job.status }}
        run: |
          read -r state action < <(python -m src.nfl.ops.heartbeat pregame || echo "failed fail")
          echo "heartbeat: slug=nfl-pregame state=$state action=$action"
          [ -z "$HC_PING_KEY" ] || [ "$action" = "none" ] && exit 0
          suffix=""; [ "$action" = "success" ] || suffix="/fail"
          curl -fsS -m 10 --retry 3 -o /dev/null --data-raw "state=$state run=${{ github.run_id }}" "https://hc-ping.com/$HC_PING_KEY/nfl-pregame$suffix" || true
