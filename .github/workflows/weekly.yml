# Weekly totals pipeline. Times are UTC; ET = UTC-4 in the fall.
#   Tue 14:10 UTC (10:10 AM ET)  opener odds snapshot + record last week's results
#   Thu/Sat/Sun 13:10 UTC        current odds snapshot + totals prediction snapshot
#
# Source code comes from `main` (read-only). Generated records (odds snapshots,
# prediction snapshots, results ledger) are committed ONLY to the `records` branch,
# which contains nothing but data/odds/** and data/predictions/**.
#
# Guarantees enforced below:
#   1. The code checkout is never committed or pushed.
#   2. Only files under data/odds/ and data/predictions/ are copied to the records checkout.
#   3. A guard step fails the job if the staged change touches any other path.
#   4. The push refspec is hard-coded to refs/heads/records; there is no push to any other ref.
#   5. Existing record files are never modified or deleted (append-only check).
#
# Requires repository secret ODDS_API_KEY.
name: Weekly totals

on:
  schedule:
    - cron: "10 14 * * 2"
    - cron: "10 13 * * 4,6,0"
  workflow_dispatch:
    inputs:
      tag:
        description: "odds snapshot tag (opener, current, pregame)"
        default: "current"

permissions:
  contents: write

concurrency:
  group: weekly-records
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source (main, read-only use)
        uses: actions/checkout@v4
        with:
          ref: main
          path: code
          persist-credentials: false

      - name: Check out records branch (create if missing)
        run: |
          git clone --no-checkout "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" records
          cd records
          if git ls-remote --exit-code --heads origin records >/dev/null; then
            git checkout records
          else
            git checkout --orphan records
            git rm -rf --quiet . || true
            mkdir -p data/odds data/predictions
            printf "# records\n\nAutomated, append-only history: odds snapshots, totals prediction snapshots, results ledger.\nNo source code lives on this branch. Written only by .github/workflows/weekly.yml.\n" > README.md
            touch data/odds/.gitkeep data/predictions/.gitkeep
            git add README.md data
            git -c user.name="weekly-bot" -c user.email="weekly-bot@users.noreply.github.com" commit -q -m "records: initialize branch"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/pyproject.toml

      - name: Install
        working-directory: code
        run: pip install -e .

      - name: Restore prior records into the working tree
        run: |
          mkdir -p code/data/odds code/data/predictions
          cp -a records/data/odds/. code/data/odds/ 2>/dev/null || true
          cp -a records/data/predictions/. code/data/predictions/ 2>/dev/null || true

      - name: Refresh data (incremental cache)
        working-directory: code
        run: python run.py data --first-season 1999

      - name: Decide tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then t="${{ github.event.inputs.tag }}"
          elif [ "$(date -u +%u)" = "2" ]; then t="opener"
          else t="current"; fi
          case "$t" in opener|current|pregame) ;; *) echo "invalid tag $t"; exit 1;; esac
          echo "tag=$t" >> "$GITHUB_OUTPUT"

      - name: Odds snapshot
        working-directory: code
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python run.py odds --tag ${{ steps.tag.outputs.tag }}

      - name: Record results (Tuesday)
        if: steps.tag.outputs.tag == 'opener'
        working-directory: code
        run: python run.py record-results

      - name: Totals prediction snapshot (game days)
        if: steps.tag.outputs.tag != 'opener'
        working-directory: code
        run: python run.py predict

      - name: Copy records (data/odds and data/predictions only)
        run: |
          mkdir -p records/data/odds records/data/predictions
          cp -a code/data/odds/. records/data/odds/
          cp -a code/data/predictions/. records/data/predictions/

      - name: Guard (records-only paths, append-only, no secrets)
        working-directory: records
        run: |
          git add -A
          bad=$(git diff --cached --name-only | grep -v -E '^data/(odds|predictions)/' || true)
          if [ -n "$bad" ]; then echo "Refusing to commit paths outside data/odds or data/predictions:"; echo "$bad"; exit 1; fi
          # Immutable files may not change. Append-only CSVs may only grow at the end.
          for f in $(git diff --cached --name-only --diff-filter=MD); do
            case "$f" in
              data/odds/book_lines.csv|data/odds/game_summary.csv|data/predictions/totals_ledger.csv|data/predictions/totals_index.json)
                if [ "$f" != "data/predictions/totals_index.json" ]; then
                  old=$(git show HEAD:"$f" | wc -c)
                  if ! cmp -s -n "$old" <(git show HEAD:"$f") "$f"; then echo "Append-only file rewritten: $f"; exit 1; fi
                fi ;;
              *) echo "Immutable record modified or deleted: $f"; exit 1 ;;
            esac
          done
          if git diff --cached | grep -E -i 'apiKey=|ODDS_API_KEY=.+' ; then echo "Possible secret in staged records"; exit 1; fi
          git diff --cached --stat

      - name: Commit and push to records
        working-directory: records
        run: |
          git -c user.name="weekly-bot" -c user.email="weekly-bot@users.noreply.github.com" \
            commit -q -m "records: ${{ steps.tag.outputs.tag }} snapshot $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "nothing to commit"; exit 0; }
          git push origin HEAD:refs/heads/records
