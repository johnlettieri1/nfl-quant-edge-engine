# Weekly totals pipeline (Phase 4). GitHub cron is UTC-only, so every scheduled snapshot has TWO
# cron lines (one for EDT, one for EST). `run.py schedule-gate` checks America/New_York local time
# (zoneinfo, DST-automatic) and keeps only the run at/after the ET target; the other exits before
# any credit is spent. Targets (ET):
#   tue_scheduled        Tue 10:10 AM  odds + weather + settle last week's results (ledger v2)
#   thu_scheduled        Thu  9:10 AM  odds + weather + totals prediction snapshot
#   sat_scheduled        Sat  9:10 AM  odds + weather + totals prediction snapshot
#   sun_scheduled        Sun  9:10 AM  odds + weather + totals prediction snapshot
#   sun_night_scheduled  Sun 11:30 PM  odds + weather (earlier first_observed for next week)
# Pregame (T-20) snapshots are taken by .github/workflows/pregame.yml.
#
# Source code comes from `main` (read-only). Generated records are committed ONLY to the
# `records` branch (data/odds/**, data/predictions/**, data/weather/**).
# Guarantees:
#   1. The code checkout is never committed or pushed.
#   2. Only data/odds, data/predictions and data/weather are copied to the records checkout.
#   3. src/nfl/ops/records_guard.py fails the job on any other path, any modified/deleted immutable
#      record, any rewritten append-only CSV, or any API key in staged content.
#   4. The push refspec is hard-coded to refs/heads/records (retried with a rebase if the pregame
#      planner pushed in between; both workflows only ADD files there, except this job's predictions index
#      and ledger, which the planner never touches).
#
# Requires repository secret ODDS_API_KEY. Open-Meteo needs no key.
name: Weekly totals

on:
  schedule:
    - cron: "10 14 * * 2"      # tue_scheduled during EDT
    - cron: "10 15 * * 2"      # tue_scheduled during EST
    - cron: "10 13 * * 4,6,0"  # thu/sat/sun_scheduled during EDT
    - cron: "10 14 * * 4,6,0"  # thu/sat/sun_scheduled during EST
    - cron: "30 3 * * 1"       # sun_night_scheduled during EDT (Mon 03:30 UTC)
    - cron: "30 4 * * 1"       # sun_night_scheduled during EST (Mon 04:30 UTC)
  workflow_dispatch:
    inputs:
      kind:
        description: "snapshot kind (auto = use the ET schedule gate)"
        default: "auto"
        type: choice
        options: [auto, manual, tue_scheduled, thu_scheduled, sat_scheduled, sun_scheduled, sun_night_scheduled]

permissions:
  contents: write

concurrency:
  group: weekly-records
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source (main, read-only use)
        uses: actions/checkout@v4
        with:
          ref: main
          path: code
          persist-credentials: false

      - name: Check out records branch (create if missing)
        run: |
          git clone --no-checkout "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" records
          cd records
          if git ls-remote --exit-code --heads origin records >/dev/null; then
            git checkout records
          else
            git checkout --orphan records
            git rm -rf --quiet . || true
            mkdir -p data/odds data/predictions data/weather
            printf "# records\n\nAutomated, append-only history: odds snapshots, forecast weather, totals prediction snapshots, results ledger.\nNo source code lives on this branch.\n" > README.md
            touch data/odds/.gitkeep data/predictions/.gitkeep data/weather/.gitkeep
            git add README.md data
            git -c user.name="weekly-bot" -c user.email="weekly-bot@users.noreply.github.com" commit -q -m "records: initialize branch"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ET schedule gate (no credits spent)
        id: gate
        working-directory: code
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.kind }}" != "auto" ]; then
            python run.py schedule-gate --raw-dir ../records/data/odds/raw --force-kind "${{ github.event.inputs.kind }}" --github-output "$GITHUB_OUTPUT"
          else
            python run.py schedule-gate --raw-dir ../records/data/odds/raw --github-output "$GITHUB_OUTPUT"
          fi
        env:
          PYTHONPATH: .

      - name: Install
        if: steps.gate.outputs.kind != 'none'
        working-directory: code
        run: pip install -e .

      - name: Restore prior records into the working tree
        if: steps.gate.outputs.kind != 'none'
        run: |
          mkdir -p code/data/odds code/data/predictions code/data/weather
          cp -a records/data/odds/. code/data/odds/ 2>/dev/null || true
          cp -a records/data/predictions/. code/data/predictions/ 2>/dev/null || true
          cp -a records/data/weather/. code/data/weather/ 2>/dev/null || true

      - name: Refresh data (incremental cache)
        if: steps.gate.outputs.kind != 'none'
        working-directory: code
        run: python run.py data --first-season 1999

      - name: Odds snapshot + forecast weather
        if: steps.gate.outputs.kind != 'none'
        working-directory: code
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python run.py odds --kind ${{ steps.gate.outputs.kind }} --trigger ${{ github.event_name == 'workflow_dispatch' && 'manual' || 'schedule' }}

      # Settlement and predictions spend no credits, so they still run if the odds step was refused
      # (HALT file, reserve, weekly cap); the job is still marked failed so the refusal is visible.
      - name: Record results (Tuesday)
        if: always() && steps.gate.outputs.kind == 'tue_scheduled'
        working-directory: code
        run: python run.py record-results

      - name: Totals prediction snapshot (Thu/Sat/Sun morning)
        if: always() && contains(fromJSON('["thu_scheduled","sat_scheduled","sun_scheduled"]'), steps.gate.outputs.kind)
        working-directory: code
        run: python run.py predict

      # Copy/Guard/Commit run even if an earlier step failed, so anything already paid for (for example a
      # pull stopped by the cost-anomaly check, which also writes a HALT file) is still committed to records.
      - name: Copy records (data/odds, data/predictions, data/weather only)
        if: always() && steps.gate.outputs.kind != 'none'
        run: |
          mkdir -p records/data/odds records/data/predictions records/data/weather
          cp -a code/data/odds/. records/data/odds/
          cp -a code/data/predictions/. records/data/predictions/
          cp -a code/data/weather/. records/data/weather/ 2>/dev/null || true

      - name: Guard (records-only paths, immutable, append-only, no secrets)
        id: guard
        if: always() && steps.gate.outputs.kind != 'none'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          git -C records add -A
          python code/src/nfl/ops/records_guard.py --repo records
          git -C records diff --cached --stat

      - name: Commit and push to records
        if: always() && steps.gate.outputs.kind != 'none' && steps.guard.outcome == 'success'
        working-directory: records
        run: |
          git -c user.name="weekly-bot" -c user.email="weekly-bot@users.noreply.github.com" \
            commit -q -m "records: ${{ steps.gate.outputs.kind }} snapshot $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3; do
            if git push origin HEAD:refs/heads/records; then exit 0; fi
            # every snapshot writes NEW files only, so a concurrent records commit rebases cleanly
            git -c user.name="weekly-bot" -c user.email="weekly-bot@users.noreply.github.com" pull --rebase --quiet origin records
          done
          echo "::error title=records::push failed after 3 attempts"; exit 1
