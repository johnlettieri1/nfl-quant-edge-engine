name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Fetch real nflverse schedules (the sign-convention leakage test reads them)
        run: python run.py data --schedules-only
      - name: Unit tests
        run: python -m pytest tests/unit -q
      - name: Leakage suite (gates the project)
        run: python -m pytest tests/leakage -q
      - name: Property tests
        run: python -m pytest tests/property -q
