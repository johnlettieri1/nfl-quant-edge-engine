[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nfl-quant-edge-engine"
version = "0.2.0"
description = "NFL totals (Over/Under) research engine: nflreadpy data, leak-free walk-forward backtests, per-book odds snapshots, CLV ledger"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "nflreadpy>=0.1.5",
    "polars>=1.16",
    "pandas>=2.2",
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "pyarrow>=17.0",
    "requests>=2.31",
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "hypothesis>=6.90"]
# Moneyline/spread/props research code and the rejected GBM comparison rows. Not
# needed for the totals pipeline; install only to run the legacy backtests/site.
research = ["xgboost>=2.0", "lightgbm>=4.0", "matplotlib>=3.7", "statsmodels>=0.14"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
